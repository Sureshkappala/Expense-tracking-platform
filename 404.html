<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found — Stackly</title>
  <meta name="description" content="Sorry, the requested page could not be located.">
  <link rel="stylesheet" href="css/style.css?v=19.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body style="margin: 0; background-color: #0A0F1D; color: #FFFFFF; overflow-x: hidden;">
  <!-- Page Preloader -->
  <div id="preloader">
    <div class="preloader-content">
      <div class="spinner"></div>
      <div class="preloader-logo">STACKLY</div>
    </div>
  </div>


  <!-- 404 Content Container -->
  <main class="error-page-container">
    
    <div class="error-number">404</div>
    
    <!-- Floating Warning Triangle -->
    <div class="error-warning-icon">
      <svg viewBox="0 0 512 512" width="76" height="76" style="display: inline-block; vertical-align: middle;">
        <path fill="#FFB800" d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7 .2 40.1S486.3 480 472 480H40c-14.3 0-27.6-7.7-34.7-20.1s-7-27.8 .2-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24V296c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/>
      </svg>
    </div>
    
    <h1 class="error-message">Lost in the Expense Portal?</h1>
    <p class="error-description">The page, budget category, or financial ledger entry you are searching for is in a different sector or has been moved!</p>
    
    <div class="error-btns">
      <button onclick="goBackOrHome()" class="btn-error-back" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Go Back
      </button>
      <a href="index.html" class="btn-error-home">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Back to Home
      </a>
    </div>
    
  </main>

  <script src="js/script.js"></script>
</body>
</html>
